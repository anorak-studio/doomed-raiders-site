hero:
  kicker: Paleontological Madness
  title: Save your museum from bankruptcy!
  lede: Explore wild lands, uncover lost temples, dig for fossils and bring your discoveries back to your exhibitions to attract new visitors!
  cta: Wishlist on Steam
  steamSoon: Steam page coming soon
  follow: Follow the expedition
  secondary: See the expedition
  soon: Coming soon to Steam · PC
  alt: Three Raiders on a skull-covered cliff watch a giant sauropod in a misty jungle.
expedition:
  eyebrow: The loop
  title: One expedition, four steps
  intro: Every level is an expedition. Finding something precious is only half the job. Bringing it back is the other half.
  steps:
  - n: '1'
    title: The museum is broke
    text: The halls are empty, the creditors are waiting and the curator is counting on you.
    img: museum-parasaurolophus.webp
    alt: A Raider and the purple-haired curator stand before a parasaurolophus skeleton.
  - n: '2'
    title: Set sail
    text: The houseboat and its one-eyed captain carry the crew to the next level.
    img: boat-jungle.webp
    alt: The houseboat, packed with Raiders, docks at the edge of a misty jungle.
  - n: '3'
    title: Dig and survive
    text: Dig, climb, slash. Switch between the three Raiders. Die a little.
    img: biome-dark-forest.webp
    alt: A Raider leaps with a machete above red-eyed ghouls rising from the ground.
  - n: '4'
    title: Extract and exhibit
    text: Get out alive with the loot. Every fossil you bring back fills a hall and draws new visitors.
    img: museum-stegosaurus.webp
    alt: Visitors admire a stegosaurus skeleton at the museum.
game:
  eyebrow: The game
  title: Platforming, digging and very bad ideas
  text:
  - 'Doomed Raiders is a unique blend of action platformer and delirious paleontology simulator. Take control of Paleocorp and its natural history museum: solve puzzles, fight monsters and face a mysterious cult… all while saving the world from cosmic horrors.'
  - 'The humor comes from the situations: a perfectly safe plan that fails immediately, a yeti at the end of a grappling hook, or a giant thing that is definitely not a whale.'
  quote: This is NOT a whale!!!
  quoteAlt: The crew on the boat's roof shouts “This is NOT a whale!!!” at a giant creature with huge teeth.
  pillars:
  - k: Genre mix
    v: Action platforming, exploration, combat, optional management and wacky puzzles.
  - k: Dark humor
    v: Absurd deaths and dubious plans. Disaster is part of the charm.
  - k: Exploration
    v: Hidden paths, secret areas, relics and a world map to roam.
museum:
  eyebrow: Paleocorp · Natural history museum
  title: The museum
  intro: Every fossil you bring back fills a hall, draws new visitors and pays for the next expedition. Improve your exhibitions to save Paleocorp. In the field, you take the risks; at the museum, you see the results.
  label: Exhibit
  specimens:
  - 'no': DR-001
    name: Stegosaurus
    era: Late Jurassic · about 150 million years ago
    note: Rebuilt from 37 pieces. Two Raiders are still missing.
    img: museum-stegosaurus.webp
    alt: Stegosaurus skeleton on display beneath tall windows.
  - 'no': DR-002
    name: Spinosaurus
    era: Late Cretaceous · about 95 million years ago
    note: Original dorsal sail. The guide would rather not say how it was pulled out of the water.
    img: museum-spinosaurus.webp
    alt: Spinosaurus skeleton with its tall dorsal sail.
  - 'no': DR-003
    name: Parasaurolophus
    era: Late Cretaceous · about 75 million years ago
    note: Its crest was used to communicate. The curator swears she hears it at night.
    img: museum-parasaurolophus.webp
    alt: Parasaurolophus skeleton on a plinth beside an ivy-covered column.
raiders:
  eyebrow: Always stay in group
  title: Three Raiders
  intro: Each one has an ability that opens paths of their own. Switch between them to get past obstacles and keep the team alive.
  inGame: In game
  list:
  - id: explorer
    name: The Explorer
    tag: Mobility · grappling hook
    text: The grappling hook carries him across chasms to paths no one else can reach. Always ready to go a little too far.
    alt: The Explorer, bearded and hatted, a shovel over his shoulder.
  - id: fast
    name: The Fast
    tag: Speed · kick jump
    text: The fastest and most agile of the trio. She jumps higher than anyone, and her kick jump sends her where precision beats power.
    alt: The Fast, hair in a bun, machete in hand.
  - id: strong
    name: The Strong
    tag: Strength · heavy objects
    text: He pushes, breaks and lifts whatever is in the way, giant fossils included. When a puzzle resists, he is the least subtle solution.
    alt: The Strong carries a huge rock with a fossil skull inside.
biomes:
  eyebrow: A doomed world
  title: Biomes
  intro: Every region has its own rules, creatures and creative ways to die. Pick a destination or let it roll.
  prev: Previous biome
  next: Next biome
  list:
  - name: Prehistoric jungle
    text: Vines, mist and a temple carved like a dinosaur head.
    img: biome-jungle.webp
  - name: Swamps and rivers
    text: Reeds, turquoise water and a diving suit for underwater digs.
    img: boat-swamp.webp
  - name: Open sea
    text: Gorgeous sunsets. And something very large underneath.
    img: biome-open-sea.webp
  - name: Sunken ruins
    text: Broken columns, giant lily pads and a sea serpent guarding it all.
    img: biome-sunken-ruins.webp
  - name: Desert canyon
    text: Cliffs, ropes and crested lizards who dislike visitors.
    img: biome-desert.webp
  - name: Sky ruins
    text: Turquoise pyramids, a horned monument and a small plane to fly home.
    img: biome-sky-ruins.webp
  - name: Dark forest
    text: Red-eyed ghouls crawl out of the ground. Keep your machete close.
    img: biome-dark-forest.webp
  - name: Caves
    text: Campfires, ladders, mushrooms and far too many bones.
    img: biome-caves.webp
  - name: Snowy peaks
    text: Ice cliffs, crystals and falls that don't forgive.
    img: biome-peaks.webp
  - name: Boreal forest
    text: Northern lights, a tree decorated with skulls and a snowball-throwing yeti.
    img: biome-boreal.webp
  more:
    name: ???
    text: Graveyards, haunted houses, ghost ships… Some expeditions are still secret.
travel:
  eyebrow: The world map
  title: Getting there is half the adventure
  text: Between expeditions, cross the world by houseboat, hot-air balloon, airship or small plane. And when an expedition goes wrong, you still have to pull off the extraction.
  balloonAlt: The three Raiders in a hot-air balloon basket above the jungle.
  mapAlt: 'World map: the hot-air balloon drifts over plains, forests and mountains, near the boat moored at the dock.'
wishlist:
  title: The museum is counting on you.
  soonTitle: Coming soon to Steam.
  text: Adding Doomed Raiders to your Steam wishlist is free and takes two seconds.
  soonText: 'The Doomed Raiders Steam page is coming soon. As soon as it opens, add the game to your wishlist: it''s free and takes two seconds.'
  reasons:
  - Steam will let you know on launch day and whenever it goes on sale.
  - Every wishlist will help Steam show the game to more players.
  - For a studio of three friends, it's the best boost there is.
  cta: Wishlist on Steam
  steamSoon: Steam page coming soon

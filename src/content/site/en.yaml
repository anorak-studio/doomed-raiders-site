studio:
  eyebrow: Anorak Studio Games
  title: Three friends, one bad idea at a time
  text:
  - We are three lifelong friends from Québec. Two of us have been coding forever, but never for a video game. The third draws pixels and can't stop.
  - One day we decided to make the game we wanted to play. Three and a half years later we're still here, adding mechanics, laughing at our bugs and burying Raiders.
  from: Mathieu, a.k.a. Wazak, also drew Fungus Forest
  team:
  - name: Mathieu Fortin
    role: Pixel art (as Wazak), development and game design
    img: team-mathieu.webp
    alt: Portrait of Mathieu Fortin.
  - name: François-Sébastien Lambert
    role: Senior lead developer
    img: team-frank.png
    alt: Illustrated portrait of Frank, hat and beard.
  - name: Patrick Pelletier
    role: Senior lead developer
    img: team-patrick.png
    alt: Illustrated portrait of Patrick, bald with a red beard and a scar across his head.
  bearAlt: 'Anorak Studio Games logo: an explorer facing a bear.'
fungus:
  eyebrow: An Anorak Studio Games × Mooonbit collaboration
  title: Fungus Forest
  text:
  - 'A turn-based puzzle game for the Game Boy Advance, born from a collaboration between Anorak Studio Games and Mooonbit. You are a little mushroom trying to reach the raft. Every step counts: hungry slugs inch one tile closer each time you move.'
  - Can you escape the forest before becoming the slugs' next snack?
